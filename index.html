<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reality Admin Terminal</title>
    <style>
        body { margin: 0; background: black; overflow: hidden; font-family: 'Courier New', monospace; color: #0F0; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 5; }
        video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.3; display: none; filter: sepia(100%) hue-rotate(120deg) brightness(1.2); }
        
        #choice-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            display: flex; gap: 40px; z-index: 100; text-align: center;
        }
        .pill-box { cursor: pointer; transition: 0.3s; }
        .pill { width: 70px; height: 30px; border-radius: 20px; margin-bottom: 5px; border: 2px solid #fff; }
        #blue-pill { background: #0044ff; box-shadow: 0 0 20px #0044ff; }
        #red-pill { background: #ff0000; box-shadow: 0 0 20px #ff0000; }

        #admin-dash {
            position: absolute; top: 10px; left: 10px; z-index: 20;
            background: rgba(0,0,0,0.7); padding: 10px; border: 1px solid #0f0; display: none; font-size: 11px;
        }

        #cat { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 100px; opacity: 0; z-index: 50; pointer-events: none; }
        .glitch-cat { opacity: 0.8 !important; animation: shake 0.2s infinite; }
        @keyframes shake { 0%{left:49%;} 50%{left:51%;} 100%{left:50%;} }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    <div id="cat">🐈</div>

    <div id="choice-overlay">
        <div class="pill-box" onclick="init('blue')">
            <div id="blue-pill" class="pill"></div>
            <span style="color:#0af">SIMULATION</span>
        </div>
        <div class="pill-box" onclick="init('red')">
            <div id="red-pill" class="pill"></div>
            <span style="color:#f00">HARDWARE</span>
        </div>
    </div>

    <div id="admin-dash">
        CORE_STABILITY: <span id="stab">100</span>%<br>
        SYSTEM_ID: <span id="sysid"></span><br>
        ORACLE_ENERGY: <span id="batt"></span>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('video');
        const dash = document.getElementById('admin-dash');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const glyphs = "日以心0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZｱｲｳｴｵ";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const rainDrops = Array.from({ length: columns }).fill(1);

        let activeMode = 'none';
        let stability = 100;

        async function init(mode) {
            activeMode = mode;
            document.getElementById('choice-overlay').style.display = 'none';
            dash.style.display = 'block';
            document.getElementById('sysid').innerText = navigator.platform;

            if (navigator.vibrate) navigator.vibrate(mode === 'red' ? [150, 50, 150] : 50);

            if (mode === 'blue') {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                    video.srcObject = stream;
                    video.style.display = 'block';
                } catch (e) { console.log("Camera blocked"); }
            }
        }

        if (navigator.getBattery) {
            navigator.getBattery().then(b => {
                const update = () => document.getElementById('batt').innerText = Math.floor(b.level * 100) + "%";
                b.onlevelchange = update; update();
            });
        }

        function draw() {
            ctx.fillStyle = activeMode === 'blue' ? 'rgba(0,0,0,0.15)' : 'rgba(0,0,0,0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = fontSize + 'px monospace';
            ctx.fillStyle = (activeMode === 'blue') ? '#0FF' : (stability < 40 ? '#F00' : '#0F0');

            rainDrops.forEach((y, i) => {
                const text = glyphs.charAt(Math.floor(Math.random() * glyphs.length));
                ctx.fillText(text, i * fontSize, y * fontSize);
                if (y * fontSize > canvas.height && Math.random() > 0.975) rainDrops[i] = 0;
                rainDrops[i]++;
            });

            if (activeMode === 'red') {
                stability = Math.max(0, stability - (Math.random() > 0.98 ? 8 : -0.2));
                stability = Math.min(100, stability);
                document.getElementById('stab').innerText = Math.floor(stability);

                if (stability < 30 && Math.random() > 0.99) {
                    const catEl = document.getElementById('cat');
                    catEl.classList.add('glitch-cat');
                    setTimeout(() => catEl.classList.remove('glitch-cat'), 1200);
                }
            }
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reality Monitor: The Choice</title>
    <style>
        body { margin: 0; background: black; overflow: hidden; font-family: 'Courier New', monospace; color: #0F0; }
        canvas { display: block; }
        
        /* Pills Container */
        #choice-overlay {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 40px; z-index: 100;
        }
        .pill {
            width: 60px; height: 25px; border-radius: 15px; cursor: pointer;
            border: 2px solid rgba(255,255,255,0.3); transition: 0.3s;
        }
        #blue-pill { background: #0000FF; box-shadow: 0 0 15px #00F; }
        #red-pill { background: #FF0000; box-shadow: 0 0 15px #F00; }
        .pill:hover { transform: scale(1.2); }

        /* Admin Dashboard */
        #admin-dash {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0, 20, 0, 0.8); padding: 15px;
            border: 1px solid #0F0; border-radius: 5px;
            display: none; pointer-events: none;
        }
        
        #cat-anomaly {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 150px; opacity: 0; pointer-events: none;
        }
        .glitch-active { animation: shake 0.3s infinite; opacity: 0.7 !important; }
        @keyframes shake {
            0% { transform: translate(-50%, -50%) skew(5deg); color: #fff; }
            50% { transform: translate(-52%, -48%) skew(-10deg); color: #0f0; }
            100% { transform: translate(-50%, -50%) skew(0deg); }
        }
    </style>
</head>
<body>

    <div id="admin-dash">
        <div>STABILITY: <span id="stab-val">100</span>%</div>
        <div id="hardware-id" style="font-size: 10px; margin-top: 10px; color: #888;"></div>
        <div id="battery-status" style="font-size: 10px; color: #888;"></div>
    </div>

    <div id="choice-overlay">
        <div id="blue-pill" class="pill" onclick="choose('blue')"></div>
        <div id="red-pill" class="pill" onclick="choose('red')"></div>
    </div>

    <div id="cat-anomaly">🐈</div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const dash = document.getElementById('admin-dash');
        const stabVal = document.getElementById('stab-val');
        const cat = document.getElementById('cat-anomaly');
        const hwId = document.getElementById('hardware-id');
        const battStatus = document.getElementById('battery-status');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const glyphs = "日以心0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZｱｲｳｴｵｶｷｸｹｺ";
        const fontSize = 18;
        const columns = canvas.width / fontSize;
        const rainDrops = Array.from({ length: columns }).fill(1);

        let mode = 'none'; 
        let stability = 100;

        function choose(c) {
            mode = c;
            document.getElementById('choice-overlay').style.display = 'none';
            if (mode === 'red') {
                dash.style.display = 'block';
                // Identify Hardware (Residual Self-Image)
                hwId.innerText = `CONSTRUCT: ${navigator.platform} | ${navigator.hardwareConcurrency} CORES`;
            }
        }

        // Battery Monitor (The Oracle)
        if (navigator.getBattery) {
            navigator.getBattery().then(batt => {
                const update = () => {
                    battStatus.innerText = `ENERGY: ${(batt.level * 100).toFixed(0)}% ${batt.charging ? '[CHARGING]' : ''}`;
                };
                batt.onlevelchange = update;
                batt.onchargingchange = update;
                update();
            });
        }

        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Blue Pill = Perfect Green. Red Pill = Glitchy White/Cyan
            ctx.fillStyle = (mode === 'red' && stability < 50) ? '#0FF' : '#0F0';
            ctx.font = fontSize + 'px monospace';

            rainDrops.forEach((y, i) => {
                let text = glyphs.charAt(Math.floor(Math.random() * glyphs.length));
                // Red pill allows glitches in the rain characters
                if (mode === 'red' && stability < 30 && Math.random() > 0.9) text = "ERROR";
                
                ctx.fillText(text, i * fontSize, y * fontSize);
                if (y * fontSize > canvas.height && Math.random() > 0.975) rainDrops[i] = 0;
                rainDrops[i]++;
            });

            if (mode === 'red') {
                if (Math.random() > 0.98) stability -= 2;
                if (stability < 100) stability += 0.1;
                stabVal.innerText = Math.floor(stability);

                if (stability < 40 && Math.random() > 0.99) {
                    cat.classList.add('glitch-active');
                    setTimeout(() => cat.classList.remove('glitch-active'), 1000);
                }
            }

            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
